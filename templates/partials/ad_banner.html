{% if show_ads and adsense_client_id %}
<!-- Bloco de Anúncio Responsivo (CLS Protegido - Google AdSense) -->
<div class="validai-ad-wrapper" role="region" aria-label="Espaço de Publicidade">
    <div class="container">
        <div class="validai-ad-box">
            <div class="validai-ad-header">
                <span class="validai-ad-badge">Publicidade</span>
            </div>
            <div class="validai-ad-slot-frame">
                <ins class="adsbygoogle validai-adsense-unit"
                     style="display:block; text-align:center;"
                     data-ad-client="{{ adsense_client_id }}"
                     data-ad-slot="{{ ad_slot_id|default('auto') }}"
                     data-ad-format="horizontal"
                     data-full-width-responsive="true"></ins>
                <script>
                    (function() {
                        try {
                            (window.adsbygoogle = window.adsbygoogle || []).push({});
                        } catch(e) {}
                    })();
                </script>
            </div>
        </div>
    </div>
</div>
{% endif %}
